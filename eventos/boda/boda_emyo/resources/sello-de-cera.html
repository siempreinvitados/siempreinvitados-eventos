<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sello de cera</title>
<style>
  /* ============ VARIABLES GLOBALES ============ */
  :root {
    --color-sello: #c4161c;          /* color base de la cera */
    --tamano-sello: 260px;           /* ancho y alto del sello */
    --color-fondo: #e9dfcb;          /* solo para la demo */

    --cera-clara:   color-mix(in srgb, var(--color-sello) 60%, #fff);
    --cera-oscura:  color-mix(in srgb, var(--color-sello) 55%, #000);
    --cera-grabado: color-mix(in srgb, var(--color-sello) 70%, #000);

    --u: calc(var(--tamano-sello) / 260);   /* unidad interna: todo escala */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--color-fondo);
  }

  /* ============ COMPONENTE ============ */
  .sello {
    position: relative;
    width: var(--tamano-sello);
    height: var(--tamano-sello);
  }

  /* Sombra proyectada siguiendo la silueta irregular */
  .sello__sombra {
    position: absolute;
    inset: 0;
    filter:
      drop-shadow(0 calc(2 * var(--u)) calc(2 * var(--u)) rgb(0 0 0 / .35))
      drop-shadow(0 calc(9 * var(--u)) calc(11 * var(--u)) rgb(0 0 0 / .30));
  }

  /* Cuerpo de cera: silueta SVG + volumen con gradientes */
  .sello__cera {
    position: absolute;
    inset: 0;
    clip-path: url(#silueta-cera);
    background:
      /* banda oscura donde el borde elevado cae hacia la cuenca */
      radial-gradient(closest-side, transparent 68%, rgb(0 0 0 / .30) 84%, transparent 96%),
      /* luz arriba-izquierda, sombra abajo-derecha */
      radial-gradient(ellipse at 36% 28%, var(--cera-clara) 0%, var(--color-sello) 55%, var(--cera-oscura) 120%);
  }

  /* Brillo especular del borde: solo en el anillo exterior */
  .sello__cera::before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg,
      transparent 0deg, rgb(255 255 255 / .25) 20deg, transparent 60deg,
      transparent 100deg, rgb(255 255 255 / .42) 140deg, transparent 185deg,
      transparent 250deg, rgb(255 255 255 / .60) 300deg, rgb(255 255 255 / .75) 335deg, transparent 360deg);
    -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 92%, transparent 100%);
            mask: radial-gradient(closest-side, transparent 78%, #000 92%, transparent 100%);
  }

  /* Cuenca hundida dentro del borde elevado */
  .sello__cuenca {
    position: absolute;
    inset: 13%;
    border-radius: 50% 48% 51% 49% / 49% 51% 49% 51%;
    background: radial-gradient(circle at 62% 62%, var(--color-sello), var(--cera-oscura) 140%);
    box-shadow:
      inset calc(7 * var(--u)) calc(9 * var(--u)) calc(16 * var(--u)) rgb(0 0 0 / .55),
      inset calc(-4 * var(--u)) calc(-5 * var(--u)) calc(10 * var(--u)) rgb(255 255 255 / .16),
      0 calc(2 * var(--u)) calc(1 * var(--u)) rgb(255 255 255 / .35),
      0 calc(-1 * var(--u)) calc(2 * var(--u)) rgb(0 0 0 / .35);
  }

  /* Anillo elevado + disco central presionado (el cuño) */
  .sello__cuno {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--cera-clara) -20%, var(--color-sello) 55%, var(--cera-oscura) 130%);
    box-shadow:
      calc(4 * var(--u)) calc(6 * var(--u)) calc(8 * var(--u)) rgb(0 0 0 / .45),  /* sombra del anillo elevado */
      calc(-1.5 * var(--u)) calc(-1.5 * var(--u)) calc(2 * var(--u)) rgb(255 255 255 / .28);
  }

  .sello__cuno::before {
    content: "";
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, var(--color-sello), var(--cera-oscura) 170%);
    box-shadow:
      inset calc(3 * var(--u)) calc(4 * var(--u)) calc(6 * var(--u)) rgb(0 0 0 / .50),
      inset calc(-2 * var(--u)) calc(-3 * var(--u)) calc(4 * var(--u)) rgb(255 255 255 / .20),
      0 calc(1 * var(--u)) 0 rgb(255 255 255 / .30);
  }

  /* Iniciales grabadas */
  .sello__texto {
    position: relative;
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    display: inline-flex;
    align-items: center;
    gap: .1em;
    font-size: calc(var(--tamano-sello) * .17);
    font-weight: 700;
    line-height: 1;
    color: var(--cera-grabado);
    text-shadow:
      0 calc(1.5 * var(--u)) 0 rgb(255 255 255 / .32),
      0 calc(-1 * var(--u)) 0 rgb(0 0 0 / .55);
    user-select: none;
  }
  .sello__texto > span { display: block; }
  .sello__inicial--1 { transform: translateY(-.2em); }   /* primera letra, un poco arriba */
  .sello__inicial--2 { transform: translateY(.2em); }    /* segunda letra, un poco abajo */
  .sello__amp { font-size: .6em; font-style: italic; }   /* & centrado en la línea */
</style>
</head>
<body>

  <!-- SVG único: silueta orgánica (coordenadas 0–100 escaladas a 0–1) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <clipPath id="silueta-cera" clipPathUnits="objectBoundingBox">
      <path transform="scale(0.01)" d="
        M 27 9
        C 34 1, 47 0, 55 2
        C 60 4, 62 8, 68 10
        C 74 11, 81 11, 87 15
        C 93 20, 96 30, 99 43
        C 101 54, 99 65, 94 75
        C 90 84, 80 88, 71 92
        C 63 96, 58 100, 50 99
        C 42 98, 36 97, 30 93
        C 25 90, 22 86, 20 83
        C 14 78, 10 72, 6 65
        C 0 56, 0 46, 2 39
        C 4 32, 9 28, 15 24
        C 19 21, 21 18, 22 14
        C 23 12, 25 11, 27 9 Z"/>
    </clipPath>
  </svg>

  <div class="sello" role="img" aria-label="Sello de cera con las iniciales SI">
    <div class="sello__sombra">
      <div class="sello__cera"></div>
    </div>
    <div class="sello__cuenca"></div>
    <div class="sello__cuno"><span class="sello__texto"><span class="sello__inicial--1">S</span><span class="sello__amp">&amp;</span><span class="sello__inicial--2">I</span></span></div>
  </div>

</body>
</html>
